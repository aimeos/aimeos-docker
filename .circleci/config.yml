version: 2.1

jobs:
  "php83apache":
    machine: true
    steps:
      - checkout
      - run: echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
      - run: docker build -t aimeos/php:8.3 php/8.3
      - run: docker run aimeos/php:8.3 dpkg -l
      - run: docker push aimeos/php:8.3

  "frankenphp85":
