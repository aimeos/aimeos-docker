workflows:
  version: 2
  build:
    jobs:
      - "php83apache"
      - "frankenphp85"
      - "php74"
      - "php80"
      - "php81"
      - "php82"
      - "php83"
      - "php84"
      - "php85"
      - "mssql2017"
      - "mssql2019"
      - "mssql2022"
      - "mssql2025"
  weekly:
    jobs:
      - "php83apache"
      - "frankenphp85"
    triggers:
      - schedule:
          cron: "0 7 * * 0"
          filters:
            branches:
              only:
                - main
  monthly:
    jobs:
      - "php83apache"
      - "frankenphp85"
      - "php74"
      - "php80"
      - "php81"
      - "php82"
      - "php83"
      - "php84"
      - "php85"
      - "mssql2017"
      - "mssql2019"
      - "mssql2022"
      - "mssql2025"
    triggers:
      - schedule:
          cron: "15 7 3 * *"
          filters:
            branches:
              only:
                - main
